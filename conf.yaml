experiment:
  task_factory:
    name: ImitationFactory
    params:
      # lafan1_dataset_conf:
      #   dataset_name:
      #     - walk1_subject1
      #     - walk1_subject2
      #     - walk1_subject5
      default_dataset_conf:
        task:
          - walk
          # - walkturn
          # - onestepleft
          # - onestepright
          # - onesteplong
          # - onestepside1
          # - onestepside2
          # - stepinplace1
          # - stepinplace2
          # - stepinplace3
          # - highjump
          # - random_walk
          # - squat
  env_params:
    env_name: MjxSkeletonTorque
    headless: false
    disable_arms: false
    scaling: 1.0
    use_box_feet: true
    horizon: 300
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
      n_step_lookahead: 0
      full_obs_lookahead: false
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_exp: 10.0   # pose sensitivity
      qvel_w_exp: 0.5    # velocity sensitivity
      com_w_exp: 5.0  # site position precision
      rpos_w_exp: 200.0  # site position precision
      # rquat_w_exp: 0.1  # site orientation precision
      # rvel_w_exp: 0.1    # site velocity precision
      qpos_w_sum: 0.6    # main pose reward
      qvel_w_sum: 0.1    # velocity weight
      com_w_sum: 0.1    # absolute com distance
      rpos_w_sum: 0.2    # site position importance
      rquat_w_sum: 0.0   # site orientation importance
      rvel_w_sum: 0.0    # site velocity importance
      action_out_of_bounds_coeff: 0.0
      # joint_acc_coeff: 0.05
      # joint_torque_coeff: 0.01
      action_rate_coeff: 0.02
      action_size_coeff: 0.02
      sites_for_mimic:
        - pelvis_mimic
        - upper_body_mimic
        - left_shoulder_mimic
        - left_hand_mimic
        - left_hip_mimic
        - left_elbow_mimic
        - left_knee_mimic
        - left_foot_mimic
        - right_shoulder_mimic
        - right_hand_mimic
        - right_hip_mimic
        - right_elbow_mimic
        - right_knee_mimic
        - right_foot_mimic
    th_params:
      random_start: true
      # fixed_start_conf: [0,0]
    # recorder_params:
    #   path:
    #     - ""
    #   tag:
    #     - ""
  cvae:
    use_cvae: true
    latent_dim: 64
    hidden_layers_enc: [1024, 512]
    hidden_layers_dec: [512, 1024]
    activation: silu
    recon_coef: 0.5
    kl_coef: 0.5
    n_step_lookahead: 4
  hidden_layers: [1024, 512]
  lr: 1e-4
  num_envs: 4
  num_steps: 1024        # steps per rollout
  total_timesteps: 5e4
  update_epochs: 4
  # proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.2
  learnable_std: true
  use_lattice: false
  full_latent_matrix: false
  lattice_sample_freq: 1
  ent_coef: 1e-3
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: silu
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1  # will automatically take seeds from 1 to n_seeds
  vmap_across_seeds: true
  # validation_interval: 64 # does nothing, it is instead based on validation.num
  validation:
    active: true
    num_steps: 600
    num_envs: 30
    num: 8 # set to 0 to disable validation
    # if none of the following is set, only the mean reward and episode length is logged
    quantities: # quantities to be used for the distance measures below
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteVelocity
      - RelSiteOrientation
    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance
    rel_site_names:
      - upper_body_mimic
      - left_hand_mimic
      - left_foot_mimic
      - right_hand_mimic
      - right_foot_mimic
    joints_to_ignore:
      - pelvis_tx
      - pelvis_tz
      - pelvis_ty
      - pelvis_tilt
      - pelvis_list
      - pelvis_rotation

# Define control subconfigs
control_config:
  position_control:
    control_type: PDControl
    control_params:
      p_gain:
        - 300  # back_bkz_actuator -> torso
        - 100  # l_arm_shy_actuator -> shoulder
        - 100  # l_arm_shx_actuator -> shoulder
        - 100  # l_arm_shz_actuator -> shoulder
        - 100  # left_elbow_actuator -> elbow
        - 100  # r_arm_shy_actuator -> shoulder
        - 100  # r_arm_shx_actuator -> shoulder
        - 100  # r_arm_shz_actuator -> shoulder
        - 100  # right_elbow_actuator -> elbow
        - 200  # hip_flexion_r_actuator -> hip_pitch
        - 200  # hip_adduction_r_actuator -> hip_roll
        - 200  # hip_rotation_r_actuator -> hip_yaw
        - 300  # knee_angle_r_actuator -> knee
        - 40   # ankle_angle_r_actuator -> ankle
        - 200  # hip_flexion_l_actuator -> hip_pitch
        - 200  # hip_adduction_l_actuator -> hip_roll
        - 200  # hip_rotation_l_actuator -> hip_yaw
        - 300  # knee_angle_l_actuator -> knee
        - 40   # ankle_angle_l_actuator -> ankle
      d_gain:
        - 6  # back_bkz_actuator -> torso
        - 2  # l_arm_shy_actuator -> shoulder
        - 2  # l_arm_shx_actuator -> shoulder
        - 2  # l_arm_shz_actuator -> shoulder
        - 2  # left_elbow_actuator -> elbow
        - 2  # r_arm_shy_actuator -> shoulder
        - 2  # r_arm_shx_actuator -> shoulder
        - 2  # r_arm_shz_actuator -> shoulder
        - 2  # right_elbow_actuator -> elbow
        - 5  # hip_flexion_r_actuator -> hip_pitch
        - 5  # hip_adduction_r_actuator -> hip_roll
        - 5  # hip_rotation_r_actuator -> hip_yaw
        - 6  # knee_angle_r_actuator -> knee
        - 2  # ankle_angle_r_actuator -> ankle
        - 5  # hip_flexion_l_actuator -> hip_pitch
        - 5  # hip_adduction_l_actuator -> hip_roll
        - 5  # hip_rotation_l_actuator -> hip_yaw
        - 6  # knee_angle_l_actuator -> knee
        - 2  # ankle_angle_l_actuator -> ankle

  torque_control:
    control_type: DefaultControl
    control_params: